[project]
name = "skillforge"
version = "0.1.0"
description = "Juge une skill à partir d'une trace d'agent : rien / reformuler / demander à l'auteur (JEV + code)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillforge = "skillforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skillforge"]
